changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - question
    authors:
      - dependabot
      - renovate
  categories:
    - title: "🚨 Breaking Changes"
      labels:
        - breaking-change
        - breaking
    - title: "🚀 New Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "⚡ Performance & Refactoring"
      labels:
        - performance
        - refactor
    - title: "📚 Documentation"
      labels:
        - documentation
        - docs
    - title: "📦 Dependencies & Maintenance"
      labels:
        - dependencies
        - chore
    - title: "Other Changes"
      labels:
        - "*"
