name: Bug report
description: Report a problem with Games Library Manager
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please provide enough detail to reproduce the issue.
        Do not include API keys, secrets, or other sensitive information.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the problem.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Launch GamesLibraryViewer.exe
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version / build
      description: Version, commit, or build date if known.
      placeholder: "Unreleased / built 2026-11-14"
  - type: input
    id: webview2
    attributes:
      label: WebView2 runtime version
      description: If known (Edge WebView2 Runtime version).
      placeholder: "e.g. 131.x"
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Library root, affected storefront(s), and relevant settings (no secrets/keys).
      placeholder: |
        Library root: D:\Games
        Storefronts: Steam, itch.io
        Launcher overrides: ...
  - type: textarea
    id: logs
    attributes:
      label: Logs / diagnostics
      description: Relevant output or error messages (e.g. crash.txt, UI errors). Remove secrets and personal data.
      render: text
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I removed secrets, API keys, and personal data from all attachments/logs.
          required: true
        - label: I searched existing issues for duplicates.
          required: true